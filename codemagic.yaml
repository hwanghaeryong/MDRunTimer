workflows:
  ios-compile-check:
    name: iOS compile check (no Apple account)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build iOS Simulator app without signing
        script: |
          set -e
          xcodebuild -project MDRunTimer.xcodeproj -scheme MDRunTimer -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
